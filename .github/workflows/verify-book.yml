name: Verify book and reference
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-book-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-sites.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern texlive-xetex texlive-lang-japanese texlive-lang-chinese fonts-noto-cjk
      - name: Typeset PDF and build both sites
        run: |
          bash scripts/build-pdf.sh
          bash scripts/build-sites.sh
          node scripts/test-theme.cjs
          mkdocs build --strict -d build/legacy
          python scripts/check-content.py build/book build/reference build/legacy
          bash scripts/build-pages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wick-0.3-book-review
          path: |
            wick-book.pdf
            wick-book-ja.pdf
            build/book/
            build/reference/
            build/book-ja/
            build/reference-ja/
            _site/
