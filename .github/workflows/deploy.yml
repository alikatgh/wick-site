# Publish wick.aulenor.com: landing page, reference/blog, and book.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-sites.txt
      - name: Install book typesetter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-extra lmodern
      - name: Build edition 0.3 PDF and web book
        run: |
          bash scripts/build-pdf.sh
          bash scripts/build-sites.sh
      - name: Build
        run: |
          mkdocs build --strict -d _site/docs
          cp index.html style.css theme.js wick-book.pdf CNAME _site/
          cp -R build/book _site/book
          cp -R theme/assets _site/assets
      - name: Preserve edition artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wick-0.3-book-and-sites
          path: |
            wick-book.pdf
            build/book/
            build/reference/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
